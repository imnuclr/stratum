# Stratum keybinds, for a plain-text Hyprland config.
#
# Add this line to hyprland.conf:
#     source = ~/.config/hypr/stratum-binds.conf
#
# Each key calls a global shortcut the shell registers, so the shell decides what
# a key does and this file only says which key reaches it. Volume and brightness
# go through the shell rather than straight to wpctl so its own sliders and
# indicators move with the keys instead of finding out afterwards.

bindl  = , XF86AudioPlay,         global, stratum:mediaToggle
bindl  = , XF86AudioPause,        global, stratum:mediaToggle
bindl  = , XF86AudioNext,         global, stratum:mediaNext
bindl  = , XF86AudioPrev,         global, stratum:mediaPrev

binde  = , XF86AudioRaiseVolume,  global, stratum:volumeUp
binde  = , XF86AudioLowerVolume,  global, stratum:volumeDown
bindl  = , XF86AudioMute,         global, stratum:volumeMute
bindl  = , XF86AudioMicMute,      global, stratum:micMute

binde  = , XF86MonBrightnessUp,   global, stratum:brightnessUp
binde  = , XF86MonBrightnessDown, global, stratum:brightnessDown

# Shift+Print emits SysRq rather than Print, so the third one uses Ctrl.
bind   = , Print,                 global, stratum:screenshotRegion
bind   = SUPER, Print,            global, stratum:screenshot
bind   = CTRL, Print,             global, stratum:screenshotEdit

bind   = SUPER, D,                global, stratum:deck
bind   = SUPER, C,                global, stratum:control
bind   = SUPER, Escape,           global, stratum:session

# Stratum window rules, for a plain-text Hyprland config.
#
# Add this line to hyprland.conf:
#     source = ~/.config/hypr/stratum-rules.conf

# The image viewer opens as a window of its own, not tiled to fill the screen.
windowrule = match:class ^(com\.interversehq\.qView)$, float on, size (monitor_w*0.6) (monitor_h*0.7), center on
